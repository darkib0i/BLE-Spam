name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/video-downloader-app-c8vsw9'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Video Downloader (latest debug build)
          body: |
            ## ⬇️ [Download the app (app-debug.apk)](https://github.com/darkib0i/BLE-Spam/releases/download/latest/app-debug.apk)

            Tap the link above on your Android phone.

            **On a phone:**
            1. Tap the download link (or tap `app-debug.apk` in **Assets** below — *not* "Source code").
            2. If Chrome says *"this type of file can harm your device"*, tap **Download anyway**.
            3. Open the downloaded file and allow **install unknown apps** if asked.
            4. Open it in a normal browser (Chrome/Safari), not inside TikTok/Instagram.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
