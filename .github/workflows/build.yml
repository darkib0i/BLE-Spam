name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/video-downloader-app-c8vsw9'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Video Downloader (latest debug build)
          body: |
            Auto-built debug APK of Video Downloader.

            **Install on Android:** tap `app-debug.apk` below, then when the
            browser warns about the file type, choose "Download anyway", and
            open it. Enable "install unknown apps" for your browser if asked.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
