# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon. Tuned for large Compose builds.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Run tasks in parallel across modules and cache task outputs.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX + Kotlin
android.useAndroidX=true
kotlin.code.style=official

# Keep only referenced resources to keep the APK lean.
android.nonTransitiveRClass=true
