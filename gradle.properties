# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon. Tuned for large Compose builds.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Run tasks in parallel across modules and cache task outputs for fast,
# incremental builds (part of the "fast startup" / good DX requirement).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX + Kotlin
android.useAndroidX=true
kotlin.code.style=official

# Only keep the resources actually referenced by the app to keep the APK small.
android.nonTransitiveRClass=true
android.nonFinalResIds=false
